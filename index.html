<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Moon AR — Луна</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#080b12}
#shade{position:fixed;inset:0;background:linear-gradient(#0008,transparent 28%,transparent 65%,#000a);pointer-events:none}
.panel{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);padding:12px 14px;border-radius:18px;background:#101521c9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{font-size:20px;margin:0 0 4px}.small{font-size:12px;color:#b9c2d3}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.stat b{display:block;font-size:17px}
#moon{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff,#ddd 48%,#aaa 72%,#777);box-shadow:0 0 35px 12px #fff8;display:flex;align-items:center;justify-content:center;color:#222;font-size:12px;font-weight:700}
#target{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:1px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0008}
.controls{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:15px;padding:13px 8px;background:#f4f6fb;color:#10131a;font-size:14px;font-weight:700}button.secondary{background:#202838;color:#fff}
#traj{position:fixed;inset:0;display:none;padding:80px 14px 100px;background:#070a11f2;backdrop-filter:blur(12px);overflow:auto}
#traj h2{margin:0 0 8px}.chart{position:relative;height:58vh;border:1px solid #30394b;border-radius:18px;background:linear-gradient(#111827,#090d15);overflow:hidden}
.horizon{position:absolute;left:0;right:0;bottom:16%;border-top:1px dashed #657086}.path{position:absolute;left:5%;right:5%;top:18%;height:58%;border-top:2px solid #dfe7f7;border-radius:50% 50% 0 0/100% 100% 0 0;transform:rotate(-7deg)}
.dot{position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff}.legend{display:flex;justify-content:space-between;font-size:11px;color:#aab4c8;margin-top:7px}
#status{margin-top:5px;color:#cbd4e5;font-size:12px}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video><div id="shade"></div>
<div class="panel"><h1>🌙 Moon AR</h1><div class="small" id="status">Нажмите «Запустить AR» и разрешите камеру/геолокацию.</div>
<div class="stats"><div class="stat">Азимут<b id="az">—</b></div><div class="stat">Высота<b id="alt">—</b></div><div class="stat">Фаза<b id="phase">—</b></div></div></div>
<div id="target"></div><div id="moon">ЛУНА</div>
<div id="traj"><h2>Траектория Луны</h2><div class="small" id="trajInfo"></div><div class="chart"><div class="path"></div><div class="horizon"></div><div id="dots"></div></div><div class="legend"><span>Сейчас</span><span>→ время</span></div></div>
<div class="controls"><button id="start">Запустить AR</button><button class="secondary" id="t12">Траектория 12 ч</button><button class="secondary" id="t30">Траектория 30 дней</button><button class="secondary" id="close">Камера / AR</button></div>
<script>
const $=id=>document.getElementById(id); let lat=0,lon=0,heading=0,started=false;
function deg(x){return x*Math.PI/180} function norm(x){return (x%360+360)%360}
function moonPos(d){ // компактное приближение, достаточное для визуального прототипа
 const jd=d/86400000+2440587.5, n=jd-2451545.0;
 const L=norm(218.316+13.176396*n), M=norm(134.963+13.064993*n), F=norm(93.272+13.229350*n);
 const lonM=L+6.289*Math.sin(deg(M)), latM=5.128*Math.sin(deg(F));
 const eps=23.439-deg(0.0000004*n);
 const ecl=deg(lonM), la=deg(latM);
 const ra=Math.atan2(Math.sin(ecl)*Math.cos(deg(eps))-Math.tan(la)*Math.sin(deg(eps)),Math.cos(ecl))/Math.PI*180;
 const dec=Math.asin(Math.sin(la)*Math.cos(deg(eps))+Math.cos(la)*Math.sin(deg(eps))*Math.sin(ecl))/Math.PI*180;
 const T=(jd-2451545)/36525;
 const gmst=norm(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T);
 const H=deg(norm(gmst+lon-ra)-180);
 const ph=deg(lat), dd=deg(dec);
 const alt=Math.asin(Math.sin(ph)*Math.sin(dd)+Math.cos(ph)*Math.cos(dd)*Math.cos(H))/Math.PI*180;
 const az=norm(Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(ph)-Math.tan(dd)*Math.cos(ph))/Math.PI*180+180);
 return {az,alt};
}
function phase(d){const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14);let x=((d-ref)/86400000%syn+syn)%syn;return Math.round(x/syn*100)}
function update(){if(!started)return;const p=moonPos(Date.now());$("az").textContent=p.az.toFixed(1)+"°";$("alt").textContent=p.alt.toFixed(1)+"°";$("phase").textContent=phase(Date.now())+"%";
 let da=((p.az-heading+540)%360)-180, x=Math.max(-45,Math.min(45,da)); let y=Math.max(-35,Math.min(35,-p.alt)); $("moon").style.left=`calc(50% + ${x*4}px)`;$("moon").style.top=`calc(50% + ${y*4}px)`;
 $("status").textContent=`GPS ${lat.toFixed(4)}, ${lon.toFixed(4)} · курс ${heading.toFixed(0)}°`;
}
async function start(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});$("camera").srcObject=s;}catch(e){$("status").textContent="Камера не разрешена — можно продолжить без неё."; }
 try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true}));lat=p.coords.latitude;lon=p.coords.longitude;}catch(e){$("status").textContent="Не удалось получить GPS. Разрешите геолокацию в Safari."}
 if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}
 window.addEventListener("deviceorientation",e=>{if(e.webkitCompassHeading!=null)heading=e.webkitCompassHeading;else if(e.alpha!=null)heading=norm(360-e.alpha)});started=true;update();setInterval(update,1000)}
function trajectory(days){$("traj").style.display="block";$("trajInfo").textContent=`Расчёт для ${lat.toFixed(4)}, ${lon.toFixed(4)} · ${days===0.5?"12 часов":"30 дней"}`;$("dots").innerHTML="";
 const count=days===0.5?24:60, span=days*86400000;for(let i=0;i<count;i++){const t=Date.now()+i*span/(count-1),p=moonPos(t);let left=4+i/(count-1)*92, top=78-Math.max(0,Math.min(90,p.alt))/90*60;const d=document.createElement("div");d.className="dot";d.style.left=left+"%";d.style.top=top+"%";d.title=new Date(t).toLocaleString()+" · аз "+p.az.toFixed(1)+"° · выс "+p.alt.toFixed(1)+"°";$("dots").appendChild(d)}}
$("start").onclick=start;$("t12").onclick=()=>trajectory(.5);$("t30").onclick=()=>trajectory(30);$("close").onclick=()=>$("traj").style.display="none";
</script></body></html>
